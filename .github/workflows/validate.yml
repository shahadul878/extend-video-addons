name: Validate Plugin

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

env:
  PLUGIN_SLUG: videtect
  MAIN_FILE: videtect.php
  SVN_URL: https://plugins.svn.wordpress.org/videtect/
  PLUGIN_URL: https://wordpress.org/plugins/videtect/

jobs:
  validate:
    name: Validate Plugin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, zip

      - name: Validate readme.txt
        run: |
          if [ ! -f readme.txt ]; then
            echo "❌ readme.txt not found"
            exit 1
          fi

          if ! grep -q '^=== .* ===$' readme.txt; then
            echo "❌ Missing plugin title header (=== Plugin Name ===)"
            exit 1
          fi

          REQUIRED_HEADERS=("Stable tag" "Requires at least" "Tested up to" "Requires PHP" "License")
          for header in "${REQUIRED_HEADERS[@]}"; do
            if ! grep -q "^${header}:" readme.txt; then
              echo "❌ Missing required header: ${header}"
              exit 1
            fi
          done

          echo "✅ readme.txt validation passed"

      - name: Check plugin header
        run: |
          if [ ! -f "${{ env.MAIN_FILE }}" ]; then
            echo "❌ Main plugin file not found: ${{ env.MAIN_FILE }}"
            exit 1
          fi

          REQUIRED_HEADERS=("Plugin Name" "Version" "Author" "License" "Text Domain")
          for header in "${REQUIRED_HEADERS[@]}"; do
            if ! grep -q "${header}:" "${{ env.MAIN_FILE }}"; then
              echo "❌ Missing required plugin header: ${header}"
              exit 1
            fi
          done

          if ! grep -q "Text Domain: ${{ env.PLUGIN_SLUG }}" "${{ env.MAIN_FILE }}"; then
            echo "❌ Text Domain must be ${{ env.PLUGIN_SLUG }}"
            exit 1
          fi

          echo "✅ Plugin header validation passed (${{ env.PLUGIN_SLUG }})"

      - name: Check for syntax errors
        run: |
          ERRORS=""
          while IFS= read -r file; do
            OUTPUT=$(php -l "$file" 2>&1)
            if echo "$OUTPUT" | grep -q "Parse error\|Fatal error"; then
              ERRORS="${ERRORS}\n${OUTPUT}"
            fi
          done < <(find . -name "*.php" -not -path "./.git/*" -not -path "./vendor/*")

          if [ -n "$ERRORS" ]; then
            echo "❌ PHP syntax errors found:"
            echo -e "$ERRORS"
            exit 1
          fi
          echo "✅ No PHP syntax errors"

      - name: Validate version consistency
        run: |
          PLUGIN_VERSION=$(grep "^\s*\* Version:" "${{ env.MAIN_FILE }}" | head -1 | sed 's/.*Version:[[:space:]]*\([0-9.]*\).*/\1/' | tr -d ' ')
          CONSTANT_VERSION=$(grep "define( 'VIDETECT_VERSION'" "${{ env.MAIN_FILE }}" | sed "s/.*'\([0-9.]*\)'.*/\1/" | tr -d ' ')
          README_VERSION=$(grep "Stable tag:" readme.txt | sed 's/Stable tag:[[:space:]]*\([0-9.]*\).*/\1/' | tr -d ' ')

          echo "Plugin header: $PLUGIN_VERSION"
          echo "VIDETECT_VERSION: $CONSTANT_VERSION"
          echo "readme Stable tag: $README_VERSION"

          if [ "$PLUGIN_VERSION" != "$README_VERSION" ] || [ "$PLUGIN_VERSION" != "$CONSTANT_VERSION" ]; then
            echo "⚠️ Version mismatch (OK during development; must match before release)"
          else
            echo "✅ Version consistency check passed: $PLUGIN_VERSION"
          fi

      - name: Validate plugin structure
        run: |
          REQUIRED_FILES=(
            "${{ env.MAIN_FILE }}"
            "readme.txt"
            "uninstall.php"
            "assets/js/admin.js"
            "includes/class-video-source-detector.php"
            "includes/class-video-widget-enhancer.php"
            "includes/class-settings-page.php"
            ".distignore"
          )

          MISSING=0
          for file in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$file" ]; then
              echo "❌ Missing required file: $file"
              MISSING=1
            fi
          done

          if [ "$MISSING" -eq 0 ]; then
            echo "✅ Plugin structure validation passed for ${{ env.PLUGIN_SLUG }}"
            echo "   ${{ env.PLUGIN_URL }}"
            echo "   ${{ env.SVN_URL }}"
          else
            exit 1
          fi
